name: Build Android TV APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/PineDramaTV.apk
          ls -la release_apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PineDramaTV-APK
          path: release_apk/PineDramaTV.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PineDrama TV ${{ github.ref_name }} (Toàn màn hình & Không giật lag)"
          body: |
            ### 🎉 PineDrama TV ${{ github.ref_name }}
            - 🚀 **Khắc phục triệt để giật lag**: Tự động tắt video nền mờ và bộ lọc GPU, bật Hardware Acceleration.
            - 📺 **Toàn màn hình 100%**: Ẩn thanh bên, tối ưu xem phim không viền trên TV.
            - 📂 **Menu chọn tập**: Bấm `Menu` để mở/đóng danh sách tập.
            - 🎮 **Chuyển tập trên Remote**: Bấm `Xuống` (tập tiếp) / `Lên` (tập trước).
          files: release_apk/PineDramaTV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
