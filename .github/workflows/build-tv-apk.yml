name: Build Android TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/PineDramaTV.apk
          ls -la release_apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PineDramaTV-APK
          path: release_apk/PineDramaTV.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0-tv
          name: "PineDrama TV v1.3.0 (Tích hợp Chuột ảo Virtual Mouse trên TV)"
          body: |
            ### 🎉 PineDrama TV v1.3.0
            - 🖱️ **Tích hợp Chuột ảo (Virtual Mouse)**: Bấm phím mũi tên trên remote TV để di chuyển con trỏ chuột, bấm OK để click vào bất kỳ nút nào trên web (Đăng nhập, Captcha, chọn tập).
            - 🎮 **Chế độ xem video linh hoạt**: Trong lúc xem phim, bấm phím `Menu` hoặc `Info` để bật/tắt chuột ảo click màn hình.
            - 🔐 **Không tự đóng màn hình đăng nhập sớm**: Quét QR thoải mái trên màn hình, xong xuôi bấm nút "Lưu & Xong".
          files: release_apk/PineDramaTV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
