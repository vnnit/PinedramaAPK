name: Build Android TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/PineDramaTV.apk
          ls -la release_apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PineDramaTV-APK
          path: release_apk/PineDramaTV.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-tv
          name: "PineDrama TV v1.2.0 (Fix phát video TikTok và đồng bộ trạng thái đăng nhập)"
          body: |
            ### 🎉 PineDrama TV v1.2.0
            - 🎬 **Khắc phục lỗi phát video TikTok**: Không bị kẹt ở video logo TikTok 2 giây nữa, phát thẳng vào video phim và toàn bộ danh sách tập.
            - 🎮 **Điều khiển Remote TV**: Bấm Lên / Xuống để chuyển tập (Next / Previous episode), Trái / Phải tua 10s, OK Play/Pause.
            - 🔐 **Đồng bộ trạng thái đăng nhập**: Tự động nhận diện cookie và lưu trạng thái đăng nhập TikTok vĩnh viễn trên TV.
          files: release_apk/PineDramaTV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
