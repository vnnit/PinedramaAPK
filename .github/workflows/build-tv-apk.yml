name: Build Android TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/PineDramaTV.apk
          ls -la release_apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PineDramaTV-APK
          path: release_apk/PineDramaTV.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-tv
          name: "PineDrama TV v1.1.0 (Tích hợp Đăng nhập TikTok QR Code)"
          body: |
            ### 🎉 PineDrama TV v1.1.0
            - 🔐 **Đăng nhập TikTok trực tiếp trên TV**: Bấm nút Đăng nhập $\rightarrow$ Quét mã QR bằng app TikTok trên điện thoại là TV tự động đăng nhập.
            - 🎬 **Mở khóa toàn bộ danh sách tập (Short Drama / Series)**: Xem mượt mà các link dạng `shortdrama.tiktok.com` và `tiktok.com/@.../video/...` mà không bao giờ bị lỗi 404 Goofy Server hay chặn login gate.
            - 📺 **Fix lỗi WebView**: Hỗ trợ đầy đủ Cookie, Third-party Storage và xử lý cửa sổ pop-up.
            - 🔄 **Tự động cập nhật**: Hỗ trợ update tự động từ GitHub.
          files: release_apk/PineDramaTV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
