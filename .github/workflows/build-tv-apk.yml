name: Build Android TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/PineDramaTV.apk
          ls -la release_apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PineDramaTV-APK
          path: release_apk/PineDramaTV.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1-tv
          name: "PineDrama TV v1.2.1 (Bản chuẩn: Bắt mã bytedance:// và hoàn tất đăng nhập)"
          body: |
            ### 🎉 PineDrama TV v1.2.1
            - 🎯 **Bắt chính xác sự kiện đăng nhập TikTok**: Tự động nhận diện tín hiệu `bytedance://dispatch_message` khi bạn quét QR thành công để lưu phiên đăng nhập ngay lập tức.
            - 🎬 **Phát mượt Short Drama**: Không bị đứng ở video logo TikTok 2 giây, mở thẳng vào danh sách tập.
            - 🎮 **Chuyển tập bằng remote**: Bấm Lên / Xuống để chuyển tập (Next / Previous episode), Trái / Phải để tua 10s.
          files: release_apk/PineDramaTV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
